<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayshna AR | Portfolio</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Cyber-Noir Emerald Theme */
            --bg-color: #090c12;
            --card-bg: rgba(16, 23, 38, 0.8);
            --accent-color: #00e676; /* Vibrant Neon Green */
            --accent-glow: rgba(0, 230, 118, 0.4);
            --text-main: #e0e6ed;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 230, 118, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            border-bottom: 1px solid var(--border-color);
            background: rgba(9, 12, 18, 0.9);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 1.5px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 35px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            font-size: 1rem;
            font-weight: 500;
        }

        nav a:hover {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Main Container */
        .main-container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 30px;
        }

        /* Section Styling */
        section {
            margin-bottom: 80px;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: var(--text-main);
            border-left: 5px solid var(--accent-color);
            padding-left: 15px;
            text-shadow: 0 0 5px rgba(224, 230, 237, 0.3);
        }

        /* 1. Profile Section */
        .profile-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 100px;
        }

        .social-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .social-icon {
            width: 55px;
            height: 55px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1.4rem;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .social-icon:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--accent-glow);
            transform: translateY(-5px) rotate(5deg);
        }

        .profile-img-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            box-shadow: 0 0 40px var(--accent-glow);
            transition: transform 0.5s ease;
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        .profile-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .profile-title span {
            color: var(--accent-color);
        }

        .profile-subtitle {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* 2. About Me Section */
        .about-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .about-box p {
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .about-box p:last-child {
            margin-bottom: 0;
        }

        /* 3. Education Section */
        .edu-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .edu-card:hover {
            transform: translateX(10px);
            box-shadow: -5px 10px 20px rgba(0, 0, 0, 0.4);
            border-color: var(--accent-color);
        }

        .edu-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .edu-icon {
            font-size: 2rem;
            color: var(--accent-color);
        }

        .edu-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .edu-info {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-left: 45px;
        }

        .edu-time {
            font-size: 1rem;
            color: var(--accent-color);
            font-weight: 600;
            margin-left: 45px;
            display: block;
            margin-top: 5px;
        }

        /* 4. Technical Skills Section */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .skill-tag {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 18px;
            border-radius: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(1.05);
        }

        /* 5. Certificates Section */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .cert-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .cert-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px var(--accent-glow);
        }

        .cert-img-container {
            width: 100%;
            height: 200px;
            background: #000;
            overflow: hidden;
        }

        .cert-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .cert-card:hover .cert-img-container img {
            transform: scale(1.05);
        }

        .cert-content {
            padding: 25px;
        }

        .cert-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .cert-issuer {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: block;
        }

        .cert-btn {
            display: inline-block;
            padding: 12px 25px;
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .cert-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* 6. Let's Connect Section */
        .connect-section {
            text-align: center;
            background: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 25px;
            padding: 60px 30px;
            transition: all 0.5s ease;
        }

        .connect-section:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 50px var(--accent-glow);
            background: rgba(16, 23, 38, 0.95);
        }

        .connect-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .connect-title span {
            color: var(--accent-color);
        }

        .connect-text {
            font-size: 1.3rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 40px;
        }

        .email-link {
            font-size: 1.5rem;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 700;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 5px;
            transition: all 0.3s ease;
        }

        .email-link:hover {
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 50px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 100px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header { padding: 20px 5%; }
            nav a { margin-left: 15px; font-size: 0.9rem; }
            .profile-title { font-size: 2.5rem; }
            .section-title { font-size: 2rem; }
            .connect-title { font-size: 2rem; }
            .email-link { font-size: 1.1rem; }
        }
    </style>
</head>
